name: Gitea Claude and Codex Review
description: Claude Code or Codex pull request review and @mention replies for Gitea Actions — summary comment, inline findings, no third-party action.
author: maggch97
branding:
  icon: eye
  color: green

inputs:
  provider:
    description: Review backend (claude / codex). Existing workflows default to Claude.
    required: false
    default: claude
  gitea_token:
    description: Token of the bot account that posts comments (needs repository read + issue / pull request write). Never passed to the model.
    required: true
  claude_code_oauth_token:
    description: Claude subscription token from `claude setup-token`. Provide this or anthropic_api_key.
    required: false
    default: ""
  anthropic_api_key:
    description: Anthropic API key. Provide this or claude_code_oauth_token.
    required: false
    default: ""
  anthropic_base_url:
    description: Optional Anthropic-compatible endpoint.
    required: false
    default: ""
  model:
    description: Model id or alias passed to the selected CLI (empty = its default).
    required: false
    default: ""
  claude_code_version:
    description: Claude Code version to install (e.g. 2.1.284), or stable / latest. Pin it for reproducible reviews.
    required: false
    default: stable
  claude_code_executable:
    description: Use an existing Claude Code binary instead of installing one.
    required: false
    default: ""
  codex_version:
    description: Version of @openai/codex to install. Node.js and npm must be available on the Linux runner.
    required: false
    default: "0.162.0"
  codex_executable:
    description: Use an existing Codex binary instead of installing one (must support --ignore-user-config and --ignore-rules).
    required: false
    default: ""
  codex_effort:
    description: Optional Codex reasoning effort (minimal / low / medium / high / xhigh); model must support it.
    required: false
    default: ""
  codex_yolo:
    description: Run Codex without sandboxing or approval prompts (true / false). Enable only on a trusted isolated runner.
    required: false
    default: "false"
  codex_auth_mode:
    description: Codex authentication (chatgpt / api-key / access-token). No automatic switch to paid API usage.
    required: false
    default: chatgpt
  codex_home:
    description: For directory storage only, absolute persistent credential directory outside the checkout. Mount it between container jobs.
    required: false
    default: ""
  codex_auth_json:
    description: Current ChatGPT auth.json Secret; refreshed credentials are written back. For directory storage, used only to bootstrap a missing file.
    required: false
    default: ""
  codex_auth_storage:
    description: ChatGPT credential storage (gitea-secret / directory). Secret storage requires account-wide serialized jobs before Secret injection.
    required: false
    default: gitea-secret
  codex_secret_name:
    description: Repository Actions Secret updated after ChatGPT credentials refresh. Must match the secret passed to codex_auth_json.
    required: false
    default: CODEX_AUTH_JSON
  codex_secrets_token:
    description: Dedicated Gitea token with repository Secret management permission, required for gitea-secret storage. Never passed to the model.
    required: false
    default: ""
  openai_api_key:
    description: OpenAI Platform API key, only for codex_auth_mode api-key (billed separately from subscriptions).
    required: false
    default: ""
  codex_access_token:
    description: Business / Enterprise Codex access token, only for codex_auth_mode access-token.
    required: false
    default: ""
  rules_file:
    description: Repository-relative file with review rules (your REVIEW.md). Missing file = built-in generic rules.
    required: false
    default: .gitea/claude/REVIEW.md
  review_id:
    description: Namespace for this review's comment markers. Give each workflow its own id (e.g. design) to run several independent reviews on one pull request with one bot account. Lowercase letters, digits, - and _; empty keeps the original markers.
    required: false
    default: ""
  extra_prompt:
    description: Extra instructions appended to the rules.
    required: false
    default: ""
  language:
    description: Language of the comments, e.g. "Simplified Chinese". Empty = model default.
    required: false
    default: ""
  trigger_phrase:
    description: Phrase that triggers a reply in issue / pull request comments.
    required: false
    default: "@claude"
  mention_permission:
    description: Minimum repository permission of a commenter allowed to trigger Claude (read / write / admin).
    required: false
    default: write
  max_turns:
    description: Maximum Claude agent turns per run (Codex uses timeout_minutes, no turn cap).
    required: false
    default: "30"
  timeout_minutes:
    description: Timeout of the model run in minutes (includes waiting for the Codex account auth lock).
    required: false
    default: "30"
  allowed_bash:
    description: Comma-separated Bash patterns Claude may run (read-only git by default).
    required: false
    default: "git diff:*,git log:*,git show:*,git blame:*,git grep:*,git status:*"
  inline_comments:
    description: Post findings as inline review comments (true / false).
    required: false
    default: "true"
  wip_policy:
    description: Draft or "WIP:" pull requests — skip (default) or fail.
    required: false
    default: skip
  fail_on:
    description: Fail the job when a finding reaches this severity (none / low / medium / high / blocker).
    required: false
    default: none
  fail_on_error:
    description: Deprecated compatibility input. Claude and Codex execution errors always fail the job, including when false.
    required: false
    default: "true"
  show_cost:
    description: Show cost and turns in the comment footer.
    required: false
    default: "false"
  server_url:
    description: Gitea base URL. Defaults to the server the workflow runs on.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Claude Code
      id: claude
      if: inputs.provider == 'claude'
      shell: bash
      env:
        CLAUDE_VERSION: ${{ inputs.claude_code_version }}
        CLAUDE_EXECUTABLE: ${{ inputs.claude_code_executable }}
      run: |
        set -euo pipefail
        if [ -n "$CLAUDE_EXECUTABLE" ]; then
          echo "bin=$CLAUDE_EXECUTABLE" >> "$GITHUB_OUTPUT"
          "$CLAUDE_EXECUTABLE" --version
          exit 0
        fi
        curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
        bin="$HOME/.local/bin/claude"
        "$bin" --version
        echo "bin=$bin" >> "$GITHUB_OUTPUT"

    - name: Install Codex
      id: codex
      if: inputs.provider == 'codex'
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex_version }}
        CODEX_EXECUTABLE: ${{ inputs.codex_executable }}
      run: |
        set -euo pipefail
        if [ "$(uname -s)" != Linux ]; then
          echo "::error::The Codex backend requires a Linux runner."
          exit 1
        fi
        if [ -n "$CODEX_EXECUTABLE" ]; then
          bin="$CODEX_EXECUTABLE"
        else
          prefix="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gcr-codex-cli.XXXXXX")"
          npm install --prefix "$prefix" --no-audit --no-fund --ignore-scripts "@openai/codex@$CODEX_VERSION"
          bin="$prefix/node_modules/.bin/codex"
        fi
        "$bin" --version
        echo "bin=$bin" >> "$GITHUB_OUTPUT"

    - name: Review with selected backend
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        PYTHONUNBUFFERED: "1"
        GCR_GITEA_TOKEN: ${{ inputs.gitea_token }}
        GCR_SERVER_URL: ${{ inputs.server_url }}
        GCR_CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
        GCR_PROVIDER: ${{ inputs.provider }}
        GCR_CODEX_BIN: ${{ steps.codex.outputs.bin }}
        GCR_CODEX_EFFORT: ${{ inputs.codex_effort }}
        GCR_CODEX_YOLO: ${{ inputs.codex_yolo }}
        GCR_CODEX_AUTH_MODE: ${{ inputs.codex_auth_mode }}
        GCR_CODEX_HOME: ${{ inputs.codex_home }}
        GCR_CODEX_AUTH_JSON: ${{ inputs.codex_auth_json }}
        GCR_CODEX_AUTH_STORAGE: ${{ inputs.codex_auth_storage }}
        GCR_CODEX_SECRET_NAME: ${{ inputs.codex_secret_name }}
        GCR_CODEX_SECRETS_TOKEN: ${{ inputs.codex_secrets_token }}
        GCR_OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GCR_CODEX_ACCESS_TOKEN: ${{ inputs.codex_access_token }}
        GCR_MODEL: ${{ inputs.model }}
        GCR_RULES_FILE: ${{ inputs.rules_file }}
        GCR_REVIEW_ID: ${{ inputs.review_id }}
        GCR_EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        GCR_LANGUAGE: ${{ inputs.language }}
        GCR_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        GCR_MENTION_PERMISSION: ${{ inputs.mention_permission }}
        GCR_MAX_TURNS: ${{ inputs.max_turns }}
        GCR_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        GCR_ALLOWED_BASH: ${{ inputs.allowed_bash }}
        GCR_INLINE_COMMENTS: ${{ inputs.inline_comments }}
        GCR_WIP_POLICY: ${{ inputs.wip_policy }}
        GCR_FAIL_ON: ${{ inputs.fail_on }}
        GCR_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        GCR_SHOW_COST: ${{ inputs.show_cost }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
      run: python3 -m gitea_claude_review
