# .gitea/workflows/claude.yml
name: Claude

on:
  pull_request:
    # edited: only re-reviews when the title loses its "WIP:" marker.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

jobs:
  claude:
    # Comment events only start a job when the trigger phrase is present.
    # Replace claude-bot with your bot account: its replies quote the question.
    if: >-
      github.event_name == 'pull_request' ||
      (contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude-bot')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A new push cancels the running review of the same PR; each comment runs on its own.
    concurrency:
      group: claude-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the job token out of .git/config; the action fetches with its own token.
          persist-credentials: false

      - uses: https://github.com/maggch97/gitea-claude-review@v0
        with:
          gitea_token: ${{ secrets.CLAUDE_GITEA_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_version: stable
          # model: opus
          # language: Simplified Chinese
          # rules_file: .gitea/claude/REVIEW.md
          # fail_on: blocker
