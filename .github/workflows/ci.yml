name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  codex-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Codex without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund --ignore-scripts @openai/codex@0.162.0
      - name: Check review CLI options without model usage
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os, subprocess, tempfile
          from pathlib import Path
          from gitea_claude_review.codex import build_command
          binary = str(Path(os.environ['RUNNER_TEMP']) / 'codex/node_modules/.bin/codex')
          subprocess.run([binary, '--version'], check=True)
          with tempfile.TemporaryDirectory() as folder:
              path = Path(folder)
              for yolo in (False, True):
                  command = build_command(binary, '', 'high', path / 'schema.json', path / 'result.json', yolo=yolo)
                  # --help parses both modes without reading account auth or calling a model.
                  subprocess.run(command + ['--help'], check=True, timeout=30)
          PY

  claude-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Claude package
        run: |
          timeout --signal=TERM --kill-after=10s 600 npm install --prefix "$RUNNER_TEMP/claude" \
            --no-audit --no-fund --loglevel=http --fetch-timeout=60000 --fetch-retries=1 \
            @anthropic-ai/claude-code@2.1.284
      - name: Check Claude CLI options without model usage
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from gitea_claude_review.claude import build_command
          binary = str(Path(os.environ['RUNNER_TEMP']) / 'claude/node_modules/.bin/claude')
          subprocess.run([binary, '--version'], check=True, timeout=30)
          for yolo in (False, True):
              command = build_command(binary, 'claude-opus-5-5', 30, ['git diff:*'], yolo=yolo)
              subprocess.run(command + ['--help'], check=True, timeout=30)
          PY
